<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gastos del Hogar</title>

  <!-- Bootstrap CSS 5.3.9 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 7.3.1 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css">
  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Chart.js 4.6.2 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.2/dist/chart.umd.min.js" defer></script>
  <!-- jsPDF 4.2.1 & jsPDF-AutoTable 5.0.9 -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@5.0.9/dist/jspdf.plugin.autotable.min.js" defer></script>
  <!-- Bootstrap JS 5.3.9 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" defer></script>
  <!-- Lógica de la aplicación -->
  <script src="js/app.js" defer></script>
</head>
<body>
  <main class="container py-3 py-md-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-9 col-xl-8">
        <div class="card app-card p-3 p-md-4">
          <!-- Encabezado con botón de modo oscuro -->
          <header class="app-header mb-4">
            <h1 class="app-title">
              <i class="fas fa-chart-pie text-primary me-2"></i>Gastos del Hogar
            </h1>
            <button
              type="button"
              id="themeToggle"
              class="theme-toggle"
              aria-label="Cambiar a modo oscuro"
              title="Cambiar a modo oscuro"
            >
              <i id="themeIcon" class="fas fa-moon"></i>
            </button>
          </header>

          <!-- Formulario de gastos -->
          <section aria-label="Registrar gasto">
            <div class="row g-3">
              <div class="col-12 col-md-4">
                <label for="categoria" class="form-label">
                  <i class="fas fa-tag me-1"></i> Categoría
                </label>
                <select class="form-select" id="categoria">
                  <option value="">Seleccionar categoría</option>
                  <option value="Luz">⚡ Luz</option>
                  <option value="Agua">💧 Agua</option>
                  <option value="Internet">🌐 Internet</option>
                  <option value="Gas">🔥 Gas</option>
                  <option value="Supermercado">🛒 Supermercado</option>
                  <option value="Transporte">🚌 Transporte</option>
                  <option value="Otros">📦 Otros</option>
                </select>
              </div>

              <div class="col-12 col-sm-6 col-md-4">
                <label for="monto" class="form-label">
                  <i class="fas fa-dollar-sign me-1"></i> Monto ($)
                </label>
                <input type="number" class="form-control" id="monto" placeholder="Ej: 5000" min="1" step="any">
              </div>

              <div class="col-12 col-sm-6 col-md-4">
                <label for="fecha" class="form-label">
                  <i class="fas fa-calendar me-1"></i> Mes (MM-AAAA)
                </label>
                <input type="text" class="form-control" id="fecha" placeholder="Ej: 08-2025" maxlength="7" inputmode="numeric">
              </div>
            </div>

            <div class="text-center mt-4">
              <button type="button" id="btnGuardar" class="btn btn-primary-gradient btn-lg">
                <i class="fas fa-save me-1"></i> Guardar Gasto
              </button>
            </div>
          </section>

          <div id="mensaje" class="mt-3" aria-live="polite"></div>

          <!-- Estadísticas -->
          <section aria-label="Resumen de gastos" class="row g-3 mt-2">
            <div class="col-12 col-sm-4">
              <div class="stats-card">
                <div class="fs-4 mb-1"><i class="fas fa-chart-line"></i></div>
                <h3 id="totalGastos">$0</h3>
                <p>Total Gastos</p>
              </div>
            </div>
            <div class="col-6 col-sm-4">
              <div class="stats-card">
                <div class="fs-4 mb-1"><i class="fas fa-list"></i></div>
                <h3 id="cantidadGastos">0</h3>
                <p>Cantidad</p>
              </div>
            </div>
            <div class="col-6 col-sm-4">
              <div class="stats-card">
                <div class="fs-4 mb-1"><i class="fas fa-chart-bar"></i></div>
                <h3 id="promedioGastos">$0</h3>
                <p>Promedio</p>
              </div>
            </div>
          </section>

          <!-- Gráfico -->
          <section aria-label="Gráfico de gastos" class="chart-container">
            <canvas id="gastosChart"></canvas>
          </section>

          <div class="section-divider"></div>

          <!-- Consulta de gastos -->
          <section aria-label="Consultar gastos por mes">
            <div class="row g-2 align-items-end">
              <div class="col-12 col-md-6">
                <label for="consultaMes" class="form-label">
                  <i class="fas fa-search me-1"></i> Ver gastos de un mes
                </label>
                <input type="text" class="form-control" id="consultaMes" placeholder="Ej: 08-2025" maxlength="7" inputmode="numeric">
              </div>
              <div class="col-6 col-md-3">
                <button type="button" id="btnVer" class="btn btn-outline-primary w-100 py-2">
                  <i class="fas fa-search me-1"></i> Ver
                </button>
              </div>
              <div class="col-6 col-md-3">
                <button type="button" id="btnPdf" class="btn btn-outline-success w-100 py-2">
                  <i class="fas fa-file-pdf me-1"></i> PDF
                </button>
              </div>
            </div>

            <div id="resultadoGastos" class="mt-4"></div>
          </section>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
